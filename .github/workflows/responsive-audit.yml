name: Tablet ve Masaüstü Görsel Denetim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Uygulama bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Playwright ve Chromium kur
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Responsive denetim verisini hazırla
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: |
          cp .env.example .env
          python manage.py makemigrations accounts listings managed_services partners support_center ai_listing --noinput
          python manage.py migrate --noinput
          python manage.py ensure_v118_schema
          python manage.py ensure_v119_schema
          python manage.py ensure_v120_schema
          python manage.py seed_categories
          python manage.py seed_demo --with-admin

      - name: Tablet ve masaüstü ekranlarını tara
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: |
          set -e

          python manage.py runserver 127.0.0.1:8000 --noreload \
            > /tmp/ilansehri-responsive-audit-server.log 2>&1 &

          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl --fail --silent \
              http://127.0.0.1:8000/health/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail http://127.0.0.1:8000/health/

          python scripts/responsive_audit.py \
            --strict \
            --base-url http://127.0.0.1:8000 \
            --output responsive-audit-artifacts

          cp /tmp/ilansehri-responsive-audit-server.log \
            responsive-audit-artifacts/server.log

      - name: Tablet ve masaüstü ekran görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilansehri-responsive-audit-${{ github.run_number }}
          path: responsive-audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
