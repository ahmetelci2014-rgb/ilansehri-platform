<details class="header-location-picker">
  <summary>
    <span>⌖</span>
    <b>{{ header_location_label }}</b>
    <i>⌄</i>
  </summary>

  <div class="header-location-panel">
    <div class="header-radius-picker" data-header-radius>
      <span>Mesafe</span>
      <button type="button" data-radius-value="5"{% if header_location_radius == "5" %} class="active"{% endif %}>5 km</button>
      <button type="button" data-radius-value="10"{% if header_location_radius == "10" %} class="active"{% endif %}>10 km</button>
      <button type="button" data-radius-value="25"{% if header_location_radius == "25" %} class="active"{% endif %}>25 km</button>
      <button type="button" data-radius-value="50"{% if header_location_radius == "50" %} class="active"{% endif %}>50 km</button>
      <button type="button" data-radius-value="100"{% if header_location_radius == "100" %} class="active"{% endif %}>100 km</button>
    </div>
    <button type="button"
            data-nearby-search
            data-radius="{{ header_location_radius }}"
            data-url="{{ request.path }}"
            data-fallback-city="{% if user.is_authenticated %}{{ user.city }}{% endif %}"
            data-fallback-district="{% if user.is_authenticated %}{{ user.district }}{% endif %}">
      <span>◎</span>
      <div><b>Konumumu kullan</b><small>{{ header_location_radius }} km çevrendeki ilanlar</small></div>
    </button>

    <a href="{{ request.path }}?location_reset=1">
      <span>🇹🇷</span>
      <div><b>Tüm Türkiye</b><small>Tüm şehirlerdeki ilanlar</small></div>
    </a>

    <form action="{{ request.path }}" method="get">
      <label>Şehir seç</label>
      <div>
        <select name="city" required>
          <option value="">Şehir seç...</option>
          {% for value,label in header_city_choices %}
            <option value="{{ value }}"{% if header_location_city == value %} selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
        <button type="submit">Göster</button>
      </div>
    </form>
  </div>
</details>
